[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dr-environment"
version = "0.1.0"
description = "Build DataRobot execution environment Docker contexts with offline dependency caches"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
dr-environment = "dr_environment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_environment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
