[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "dr-environment"
version = "0.1.2"
description = "Build DataRobot execution environment Docker contexts with offline dependency caches"
readme = "README.md"
requires-python = ">=3.11, <3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "AUTHORS"]
authors = [{ name = "DataRobot, Inc." }]
keywords = ["datarobot", "docker", "air-gap", "offline", "execution-environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.14.0",
    "mypy>=1.14",
    "types-PyYAML",
]

[project.urls]
Homepage = "https://github.com/datarobot-oss/dr-environment"
Changelog = "https://github.com/datarobot-oss/dr-environment/blob/main/CHANGELOG.md"
Issues = "https://github.com/datarobot-oss/dr-environment/issues"

[project.scripts]
dr-environment = "dr_environment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dr_environment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
indent-width = 4
extend-exclude = ["src/dr_environment/recipe/templates"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "PL",  # pylint
    "UP",  # pyupgrade
    "INP", # missing __init__.py
    "B006", # mutable-argument-default
]
extend-ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
    "D205",
    "PLR0915", "PLR0912",
]
fixable = ["I", "D", "UP", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
allow-magic-value-types = ["int", "str", "bytes"]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104", "F401"]
# long literal Dockerfile fragments are asserted verbatim; wrapping them hurts readability
"tests/*" = ["D100", "D103", "PLR2004", "E501"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disable_error_code = ["import-untyped"]
ignore_missing_imports = true
pretty = true
show_absolute_path = true
exclude = "src/dr_environment/recipe/templates"
