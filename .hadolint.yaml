# Configuration for hadolint, which lints the generated Dockerfile in CI.
ignored:
  # "Last USER should not be root" fires per stage; the builder stages end as root on purpose,
  # to chmod the baked caches. Only the final stage matters; test_build.py asserts it is not root.
  - DL3002

# Warnings and errors gate a pull request; info-level style suggestions print but do not,
# since the layer splitting they object to is what lets a partial rebuild reuse cached steps.
failure-threshold: warning
