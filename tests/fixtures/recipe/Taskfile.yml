---
# Minimal recipe for the end-to-end context build test: a Python and an npm component
# (DEFAULT), a component with no manifest (SKIP), and an internal include, which is never a
# component. Both manifests are dependency-free, so their lockfile checks resolve offline.
#
# No Go component: `go mod verify` needs the Go toolchain, and this suite should not require it
# of a contributor. The Go cache fragment and its lockfile check are covered by unit tests.
version: '3'

# `includes:` stays the last top-level key: test_build.py's hook test appends a component to it.
includes:
  # Internal includes are never components. Pointed at a real directory with a manifest, so
  # that the `internal` filter is what excludes it rather than a path that does not resolve.
  common:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
    internal: true
  # Include key deliberately unlike its `dir:` basename: the docker context lays a component
  # out under the include key, and the cache stage COPYs that same path, so a fixture where
  # the two match cannot tell the layout destination is keyed on the right one.
  agent_app:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  frontend:
    taskfile: ./frontend/Taskfile.yaml
    dir: ./frontend
