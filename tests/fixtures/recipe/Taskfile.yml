---
# Minimal end-to-end recipe: a Python and an npm component, a manifest-less SKIP, an internal
# include. Dependency-free so locking stays offline; no Go component, that needs the toolchain.
version: '3'

# `includes:` stays the last top-level key: test_build.py's hook test appends a component to it.
includes:
  # Internal includes are never components. Pointed at a real directory with a manifest, so
  # that the `internal` filter is what excludes it rather than a path that does not resolve.
  common:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
    internal: true
  # Include key deliberately unlike its `dir:` basename: layout and the cache stage COPY are
  # keyed on the include key, and a fixture where the two match could not tell.
  agent_app:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  docs:
    taskfile: ./docs/Taskfile.yaml
    dir: ./docs
  frontend:
    taskfile: ./frontend/Taskfile.yaml
    dir: ./frontend
