version: 2

# Every label used below must exist in the repo; dependabot drops unknown ones silently.
# Every ecosystem is grouped, so each opens one pull request a week instead of one per
# dependency, and runs the check suite once rather than once per bump.
# Each ecosystem runs on its own weekday. Merging one leaves any other open bump behind main,
# which the ruleset refuses to merge, and neither dependabot nor automerge rebases it.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "skip-changelog"
      - "skip-version-bump"
      - "automerge"
    groups:
      uv:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "skip-changelog"
      - "skip-version-bump"
      - "automerge"
    groups:
      actions:
        patterns:
          - "*"

  # The two pinned manifests baked into every generated image. Dependabot's uv ecosystem
  # does not read bare requirements.txt, so these need their own pip entries.
  - package-ecosystem: "pip"
    directories:
      - "/src/dr_environment/recipe/templates/docker_context/kernel"
      - "/src/dr_environment/recipe/templates/docker_context/build-deps"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "skip-changelog"
      - "skip-version-bump"
      - "automerge"
    groups:
      pip:
        patterns:
          - "*"
