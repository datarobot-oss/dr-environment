version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "00 - Ready for Review"
      - "skip-changelog"
      - "skip-version-bump"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "00 - Ready for Review"
      - "skip-changelog"
      - "skip-version-bump"
    groups:
      actions:
        patterns:
          - "*"

  # The two pinned manifests baked into every generated image. Dependabot's uv ecosystem
  # does not read bare requirements.txt, so these need their own pip entries.
  - package-ecosystem: "pip"
    directories:
      - "/src/dr_environment/recipe/templates/docker_context/kernel"
      - "/src/dr_environment/recipe/templates/docker_context/build-deps"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "00 - Ready for Review"
      - "skip-changelog"
      - "skip-version-bump"
