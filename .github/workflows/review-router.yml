name: Review Router

# Routes review by CODEOWNERS: team labels, review requests, Slack pings, Jira links, and
# stale reminders. Team channels live in datarobot/.review-router-config.
#
# SECURITY: This workflow intentionally uses pull_request_target (not
# pull_request) because review-router never checks out or executes PR code.
# Do NOT add actions/checkout or shell run: blocks here.
#
# See: https://github.com/datarobot-oss/review-router/blob/main/docs/security/pull-request-target.md

# `opened` is left out: the org config auto-labels dependabot PRs, which would route every
# bump that automerge already handles.
on:
  pull_request_target:
    types: [labeled, closed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 3,9,15,21 * * 1-5'

permissions:
  contents: read
  pull-requests: write

jobs:
  route:
    uses: datarobot-oss/.github/.github/workflows/review-router.yml@main
    secrets: inherit
