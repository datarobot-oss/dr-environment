---
name: secret-scan
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$(pwd)":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.29.1 \
            detect --source=/repo --redact --verbose --no-banner
