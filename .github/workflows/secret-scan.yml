---
name: secret-scan
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: "gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          docker run --rm -v "$(pwd)":/repo -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.29.1 \
            detect --source=/repo --redact --verbose --no-banner
