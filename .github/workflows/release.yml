name: Release

# Tags the version `pyproject.toml` declares and publishes that build to PyPI.
# Recover a failed publish with "Re-run failed jobs"; "Re-run all jobs" discards the
# artifact, re-finds the tag, and silently skips publishing.
on:
  push:
    branches: [ main ]

# `cancel-in-progress: false` so a second merge waits, then finds this run's tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Read version from pyproject.toml
        id: version
        uses: datarobot-oss/github-actions/actions/read-pyproject-version@0.0.24

  # Ahead of the tag: tagging first would strand the version, since an existing tag
  # releases nothing.
  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Install dependencies
        run: uv sync --extra dev

      # `ci.yml` tests this commit on its own trigger, so it gates nothing. Tests only;
      # lint and audit stay there. A release can be yanked, never replaced.
      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist

  release:
    needs: [ version, build ]
    uses: datarobot-oss/github-actions/.github/workflows/create-release-on-merge.yaml@0.0.24
    with:
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
      pull-requests: read

  # A merge without a bump cuts no tag, so there is nothing to publish.
  publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI checks this environment claim, so no token is stored.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
