name: Release

# Tags the version `pyproject.toml` declares and publishes that build to PyPI.
# Recover a failed publish with "Re-run failed jobs", never "Re-run all jobs": the tag
# already exists by then, so the publish is skipped rather than retried.
on:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # Ahead of the tag: tagging first would strand the version, since an existing tag
  # releases nothing.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Read version from pyproject.toml
        id: version
        uses: datarobot-oss/github-actions/actions/read-pyproject-version@0.0.25

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --extra dev

      # Gates the publish, not the merge: `ci.yml` covers this commit on its own trigger.
      # Tests only; lint and audit stay there. A release can be yanked, never replaced.
      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist

  release:
    needs: build
    uses: datarobot-oss/github-actions/.github/workflows/create-release-on-merge.yaml@0.0.25
    with:
      version: ${{ needs.build.outputs.version }}
    permissions:
      contents: write
      pull-requests: read

  # A merge without a bump cuts no tag, so there is nothing to publish.
  publish:
    needs: [ build, release ]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI checks this environment claim, so no token is stored.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # The reusable workflow tags github.sha, not main's tip. This check is still
      # the last line before PyPI: a stale tag is deletable, a wheel is yank-only.
      - name: Verify the tag is the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.version }}
        run: |
          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG is $TAG_SHA, not the built $GITHUB_SHA."
            exit 1
          fi

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
