name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # Weekly, so a recipe or upstream change that breaks the image build surfaces without a merge.
  schedule:
    - cron: '0 6 * * 1'
  # The image build is skipped on pull requests, so this is the only way to exercise it on a branch.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Cache uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Check uv.lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff format)
        run: uv run ruff format --check src tests

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      # The templates directory is excluded from ruff and mypy, so nothing else lints these
      # scripts. F and E9 keep the scope to real breakage in adapted code, and the configs
      # skip F821 because jupyter injects the `c` they read.
      - name: Lint the shipped kernel assets
        env:
          KERNEL: src/dr_environment/recipe/templates/docker_context/kernel
        run: |
          uv run ruff check --isolated --select F,E9 \
            --per-file-ignores '*_config.py:F821' "${KERNEL}"
          docker run --rm -v "$(pwd)":/mnt -w /mnt \
            koalaman/shellcheck-alpine:v0.11.0 \
            shellcheck -S warning "${KERNEL}"/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Cache uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q --junitxml=test_results/test-results.xml --cov --no-cov-on-fail

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-py${{ matrix.python-version }}
          path: test_results/test-results.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      # `twine check` reads the metadata only. The `dr` CLI discovers this plugin by running
      # the installed console script, so install the wheel and ask it the way `dr` does.
      # The full manifest is pinned in the test suite, so only the wiring is checked here.
      - name: Verify the plugin manifest of the installed wheel
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        run: |
          set -euo pipefail
          uv tool install --force dist/*.whl
          manifest="$("${UV_TOOL_BIN_DIR}/dr-environment" --dr-plugin-manifest)"
          echo "$manifest"
          test "$(jq -r .name <<<"$manifest")" = 'environment'

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: ignore

  # Every other job here tests the code that writes the docker context. This one generates
  # the context from the fixture recipe and inspects what came out, without building a layer.
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --extra dev

      # The lockfiles are generated rather than committed, since validation runs each
      # ecosystem's own check. Both components are dependency-free, so no index is reached.
      - name: Lock the fixture recipe
        run: |
          uv lock --directory tests/fixtures/recipe/agent
          npm install --package-lock-only --ignore-scripts \
            --prefix tests/fixtures/recipe/frontend

      - name: Generate the docker context
        run: >
          uv run dr-environment recipe
          --recipe-path tests/fixtures/recipe
          --target ${{ runner.temp }}/docker_context
          --no-tarball

      - name: Lint the generated Dockerfile
        run: |
          docker run --rm -i -v "$(pwd)/.hadolint.yaml":/.hadolint.yaml:ro \
            ghcr.io/hadolint/hadolint:v2.14.0-alpine \
            hadolint --config /.hadolint.yaml - < "${{ runner.temp }}/docker_context/Dockerfile"

      # `buildx build --check` resolves the stage graph and the base image without building a
      # layer. The RedundantTargetPlatform skip covers the deliberate ARG shadowing that forces
      # linux/amd64. BuildKit updates with the runner image, so new rules can flag an unchanged PR.
      - name: Check the generated Dockerfile
        run: |
          docker buildx build --check \
            --build-arg BUILDKIT_DOCKERFILE_CHECK=skip=RedundantTargetPlatform \
            "${{ runner.temp }}/docker_context"

      - name: Upload the generated context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-context
          path: ${{ runner.temp }}/docker_context
          if-no-files-found: ignore

  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check copyright headers
        run: |
          docker run --rm -v "$(pwd)":/github/workspace \
            ghcr.io/apache/skywalking-eyes/license-eye:785bb7f3810572d6912666b4f64bad28e4360799 \
            -v info -c .licenserc.yaml header check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # Covers this project's own dependencies and the two pinned manifests that are baked
      # into every generated image, which Dependabot's uv ecosystem cannot read.
      - name: Audit dependencies for known CVEs
        run: |
          # Advisories listed in .github/pip-audit-ignore.txt are skipped, so a CVE with no fix
          # available yet does not block every open PR. That file carries the rationale per entry.
          IDS=()
          while read -r id _; do
            [ -n "$id" ] && IDS+=("$id")
          done < <(sed 's/#.*//' .github/pip-audit-ignore.txt | grep -vE '^[[:space:]]*$')
          IGNORE=()
          for id in "${IDS[@]}"; do IGNORE+=(--ignore-vuln "$id"); done
          echo "Skipping ${#IDS[@]} advisory ID(s) from .github/pip-audit-ignore.txt"
          # uv.lock already resolves this project's full closure, so export and audit directly.
          uv export --frozen --no-hashes --no-dev --no-emit-project -o "${RUNNER_TEMP}/project.txt"
          echo "::group::pip-audit project"
          uvx pip-audit==2.9.0 --disable-pip --no-deps "${IGNORE[@]}" -r "${RUNNER_TEMP}/project.txt"
          echo "::endgroup::"
          # The image manifests list direct pins only, but the build installs their transitive
          # closures. Resolve each against the image's Python before auditing, or CVEs in
          # transitive packages ship without failing CI.
          for f in src/dr_environment/recipe/templates/docker_context/kernel/requirements.txt \
                   src/dr_environment/recipe/templates/docker_context/build-deps/build-requirements.txt; do
            resolved="${RUNNER_TEMP}/$(basename "$f").resolved.txt"
            uv pip compile --python-version 3.11 --no-header --no-annotate -o "$resolved" "$f"
            echo "::group::pip-audit $f"
            uvx pip-audit==2.9.0 --disable-pip --no-deps "${IGNORE[@]}" -r "$resolved"
            echo "::endgroup::"
          done

  # The jobs above never build a layer, so a Dockerfile that only fails inside a RUN step
  # (a tool pin that does not install, a wheel with no matching Python) passes CI. This
  # builds the real image from the public agent recipe's main after every merge to main and weekly.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Clone the agent recipe
        run: >
          git clone --depth 1
          https://github.com/datarobot-community/datarobot-agent-application.git
          ${{ runner.temp }}/recipe

      - name: Generate the docker context
        run: >
          uv run dr-environment recipe
          --recipe-path ${{ runner.temp }}/recipe
          --target ${{ runner.temp }}/docker_context
          --no-tarball

      # The build needs ~15 GB for the caches; the runner ships ~14 GB free.
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the image
        run: |
          docker buildx build --platform linux/amd64 --output type=cacheonly \
            "${{ runner.temp }}/docker_context"
