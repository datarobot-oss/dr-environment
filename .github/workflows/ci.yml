name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Cache uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-3.12-

      - name: Check uv.lock is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff format)
        run: uv run ruff format --check src tests

      - name: Lint (ruff check)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      # The kernel assets are COPY'd into the image and run there, but nothing else here sees
      # them: the templates directory is excluded from ruff and mypy, and hadolint reads `RUN`
      # lines rather than copied scripts. Style is not the point for scripts adapted from
      # elsewhere; undefined names and dead imports are. The traitlets configs are skipped
      # because jupyter injects the `c` they read.
      - name: Lint the shipped kernel assets
        env:
          KERNEL: src/dr_environment/recipe/templates/docker_context/kernel
        run: |
          uv run ruff check --isolated --select F,E9 --exclude '*_config.py' "${KERNEL}"
          docker run --rm -v "$(pwd)":/mnt -w /mnt \
            koalaman/shellcheck-alpine:v0.11.0 \
            shellcheck -S warning "${KERNEL}"/*.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Cache uv download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q --junitxml=test_results/test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-py${{ matrix.python-version }}
          path: test_results/test-results.xml
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*

      # `twine check` reads the metadata only. The `dr` CLI discovers this plugin by running
      # the installed console script, so install the wheel and ask it the way `dr` does.
      - name: Verify the plugin manifest of the installed wheel
        env:
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/tool-bin
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          uv tool install --force dist/*.whl
          manifest="$("${UV_TOOL_BIN_DIR}/dr-environment" --dr-plugin-manifest)"
          echo "$manifest"
          test "$(jq -r .name <<<"$manifest")" = 'environment'
          test "$(jq -r .authentication <<<"$manifest")" = 'false'
          test "$(jq -r .version <<<"$manifest")" = "$version"

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: ignore

  # Every other job here tests the code that writes the docker context. This one generates
  # the context from the fixture recipe and inspects what came out, without building a layer.
  context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: Install dependencies
        run: uv sync --extra dev

      # Generated rather than committed: recipe validation runs each ecosystem's own check,
      # which a lockfile written by a different uv or npm fails. npm comes from the runner
      # image. Both fixture components are dependency-free, so neither reaches an index.
      - name: Lock the fixture recipe
        run: |
          uv lock --directory tests/fixtures/recipe/agent
          npm install --package-lock-only --ignore-scripts \
            --prefix tests/fixtures/recipe/frontend

      - name: Generate the docker context
        run: >
          uv run dr-environment recipe
          --recipe-path tests/fixtures/recipe
          --target ${{ runner.temp }}/docker_context
          --no-tarball

      - name: Lint the generated Dockerfile
        run: |
          docker run --rm -i -v "$(pwd)/.hadolint.yaml":/.hadolint.yaml:ro \
            ghcr.io/hadolint/hadolint:v2.14.0-alpine \
            hadolint --config /.hadolint.yaml - < "${{ runner.temp }}/docker_context/Dockerfile"

      # Resolves the stage graph and the base image without building a layer, so a stage
      # renamed out from under a `COPY --from` fails here in seconds instead of in a build.
      # RedundantTargetPlatform is skipped because TARGETPLATFORM is shadowed by an ARG on
      # purpose, to force linux/amd64 for DataRobot notebook kernels. Unlike hadolint and
      # shellcheck this is not pinned: BuildKit comes from the runner image and adds check
      # rules in minor releases, so a runner bump can redden a pull request that changed nothing.
      - name: Check the generated Dockerfile
        run: |
          docker buildx build --check \
            --build-arg BUILDKIT_DOCKERFILE_CHECK=skip=RedundantTargetPlatform \
            "${{ runner.temp }}/docker_context"

      - name: Upload the generated context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docker-context
          path: ${{ runner.temp }}/docker_context
          if-no-files-found: ignore

  licenses:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check copyright headers
        run: |
          docker run --rm -v "$(pwd)":/github/workspace \
            ghcr.io/apache/skywalking-eyes/license-eye:785bb7f3810572d6912666b4f64bad28e4360799 \
            -v info -c .licenserc.yaml header check

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      # Covers this project's own dependencies and the two pinned manifests that are baked
      # into every generated image, which Dependabot's uv ecosystem cannot read.
      - name: Audit dependencies for known CVEs
        run: |
          # Advisories listed in .github/pip-audit-ignore.txt are skipped, so a CVE with no fix
          # available yet does not block every open PR. That file carries the rationale per entry.
          IDS=()
          while read -r id _; do
            [ -n "$id" ] && IDS+=("$id")
          done < <(sed 's/#.*//' .github/pip-audit-ignore.txt | grep -vE '^[[:space:]]*$')
          IGNORE=()
          for id in "${IDS[@]}"; do IGNORE+=(--ignore-vuln "$id"); done
          echo "Skipping ${#IDS[@]} advisory ID(s) from .github/pip-audit-ignore.txt"
          # uv.lock already resolves this project's full closure, so export and audit directly.
          uv export --frozen --no-hashes --no-dev --no-emit-project -o "${RUNNER_TEMP}/project.txt"
          echo "::group::pip-audit project"
          uvx pip-audit==2.9.0 --disable-pip --no-deps "${IGNORE[@]}" -r "${RUNNER_TEMP}/project.txt"
          echo "::endgroup::"
          # The image manifests list direct pins only, but the build installs their transitive
          # closures. Resolve each against the image's Python before auditing, or CVEs in
          # transitive packages ship without failing CI.
          for f in src/dr_environment/recipe/templates/docker_context/kernel/requirements.txt \
                   src/dr_environment/recipe/templates/docker_context/build-deps/build-requirements.txt; do
            resolved="${RUNNER_TEMP}/$(basename "$f").resolved.txt"
            uv pip compile --python-version 3.11 --no-header --no-annotate -o "$resolved" "$f"
            echo "::group::pip-audit $f"
            uvx pip-audit==2.9.0 --disable-pip --no-deps "${IGNORE[@]}" -r "$resolved"
            echo "::endgroup::"
          done
